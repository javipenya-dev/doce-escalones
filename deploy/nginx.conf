# Configuración de nginx para Doce Escalones en Raspberry Pi 4
# Ubicación en el servidor: /etc/nginx/sites-available/doce-escalones
# Activar con:
#   sudo ln -s /etc/nginx/sites-available/doce-escalones /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name _;

    root /var/www/doce-escalones;
    index index.html;

    # Logs
    access_log /var/log/nginx/doce-access.log;
    error_log /var/log/nginx/doce-error.log;

    # SPA: redirigir todo a index.html si no existe el archivo
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Servir logos del backend SIN strippear /api/media
    # (el backend los tiene montados en /api/media → backend/media/logos)
    location /api/media/ {
        proxy_pass http://127.0.0.1:8001/api/media/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Proxy al backend FastAPI (localhost:8001)
    location /api/ {
        proxy_pass http://127.0.0.1:8001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket (para /api/ws y similares)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }

    # Proxy al WebSocket del backend
    location /ws {
        proxy_pass http://127.0.0.1:8001/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}